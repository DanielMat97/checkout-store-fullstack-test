name: Deploy feature (fb-*)

# Feature branches / tags: fb-xxx or fb-xxx/*
# HARD REQUIREMENT: full CI quality pipeline must succeed before any deploy.
# Creates an isolated Serverless stage (API + DynamoDB) AND an Amplify branch
# so FE+BE are fully separate from production.
#
# Branch examples: fb-42/checkout-fees , fb-99/fix-stock
# Tag examples:    fb-42/smoke
on:
  push:
    branches:
      - 'fb-*/**'
      - 'fb-*'
    tags:
      - 'fb-*/**'
      - 'fb-*'
  workflow_dispatch:
    inputs:
      ref_name:
        description: 'Override ref name (e.g. fb-42/my-feature)'
        required: false
        default: ''

concurrency:
  group: deploy-feature-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: write
  id-token: write
  pull-requests: write
  actions: read
  deployments: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
  SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
  SERVERLESS_LICENSE_KEY: ${{ secrets.SERVERLESS_LICENSE_KEY }}

jobs:
  # REQUIRED: full CI must succeed before any feature deploy.
  quality:
    name: Quality gate (required)
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Feature stack + Amplify
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    environment: feature
    outputs:
      stage: ${{ steps.meta.outputs.stage }}
      api_url: ${{ steps.api.outputs.api_url }}
      amplify_url: ${{ steps.amplify.outputs.amplify_url || steps.cors.outputs.amplify_url }}
      amplify_branch: ${{ steps.meta.outputs.amplify_branch }}
      amplify_job_id: ${{ steps.amplify.outputs.amplify_job_id }}
      amplify_gated: ${{ steps.amplify.outputs.amplify_gated }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm

      - run: npm ci
      - run: npm run build:api

      - name: Require Serverless Framework v4 auth
        run: |
          if [ -z "${SERVERLESS_ACCESS_KEY:-}" ] && [ -z "${SERVERLESS_LICENSE_KEY:-}" ]; then
            echo "### Missing Serverless auth" >> "$GITHUB_STEP_SUMMARY"
            echo "Add GitHub secret \`SERVERLESS_ACCESS_KEY\` (Dashboard → Settings → Access Keys) or \`SERVERLESS_LICENSE_KEY\`." >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi

      - name: Resolve stage from ref
        id: meta
        run: |
          REF="${{ inputs.ref_name || github.ref_name }}"
          META=$(node scripts/ci/stage-from-ref.cjs "$REF")
          echo "meta=$META"
          STAGE=$(echo "$META" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).stage))")
          BRANCH=$(echo "$META" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).amplifyBranch))")
          IS_FB=$(echo "$META" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).isFeature))")
          if [ "$IS_FB" != "true" ]; then
            echo "Ref '$REF' is not an fb-* feature ref"
            exit 1
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "amplify_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Predict Amplify URL (for CORS)
        id: cors
        run: |
          if [ -z "$AMPLIFY_APP_ID" ]; then
            echo "AMPLIFY_APP_ID not set — CORS will use localhost only"
            echo "cors_origin=http://localhost:5173" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DOMAIN=$(aws amplify get-app --app-id "$AMPLIFY_APP_ID" --query 'app.defaultDomain' --output text)
          # Amplify replaces '/' with '-' in the hostname
          HOST=$(echo '${{ steps.meta.outputs.amplify_branch }}' | sed 's|/|-|g')
          FE_URL="https://${HOST}.${DOMAIN}"
          echo "cors_origin=${FE_URL},http://localhost:5173" >> "$GITHUB_OUTPUT"
          echo "amplify_url=$FE_URL" >> "$GITHUB_OUTPUT"
          echo "Predicted Amplify URL: $FE_URL"

      - name: Load secrets from Vault (feature bundle)
        uses: ./.github/actions/load-vault-secrets
        with:
          stage: feature
          vault_addr: ${{ secrets.VAULT_ADDR }}
          role_id: ${{ secrets.VAULT_ROLE_ID }}
          secret_id: ${{ secrets.VAULT_SECRET_ID }}
          required: ${{ vars.VAULT_REQUIRED || 'false' }}

      - name: Fallback fill missing env from GitHub Secrets
        env:
          GH_PAYMENT_API_URL: ${{ secrets.PAYMENT_API_URL }}
          GH_PAYMENT_PUBLIC_KEY: ${{ secrets.PAYMENT_PUBLIC_KEY }}
          GH_PAYMENT_PRIVATE_KEY: ${{ secrets.PAYMENT_PRIVATE_KEY }}
          GH_PAYMENT_INTEGRITY_KEY: ${{ secrets.PAYMENT_INTEGRITY_KEY }}
          GH_PAYMENT_GATEWAY_MODE: ${{ vars.PAYMENT_GATEWAY_MODE_FEATURE || vars.PAYMENT_GATEWAY_MODE || 'fake' }}
        run: |
          {
            [ -n "${PAYMENT_API_URL:-}" ] || echo "PAYMENT_API_URL=$GH_PAYMENT_API_URL"
            [ -n "${PAYMENT_PUBLIC_KEY:-}" ] || echo "PAYMENT_PUBLIC_KEY=$GH_PAYMENT_PUBLIC_KEY"
            [ -n "${PAYMENT_PRIVATE_KEY:-}" ] || echo "PAYMENT_PRIVATE_KEY=$GH_PAYMENT_PRIVATE_KEY"
            [ -n "${PAYMENT_INTEGRITY_KEY:-}" ] || echo "PAYMENT_INTEGRITY_KEY=$GH_PAYMENT_INTEGRITY_KEY"
            [ -n "${PAYMENT_GATEWAY_MODE:-}" ] || echo "PAYMENT_GATEWAY_MODE=$GH_PAYMENT_GATEWAY_MODE"
          } >> "$GITHUB_ENV"

      - name: Overlay feature CORS + table
        run: |
          echo "CORS_ORIGIN=${{ steps.cors.outputs.cors_origin }}" >> "$GITHUB_ENV"
          echo "DYNAMODB_TABLE_NAME=checkout-store-${STAGE}" >> "$GITHUB_ENV"
          echo "DYNAMODB_ENDPOINT=" >> "$GITHUB_ENV"

      - name: Deploy isolated API stack
        run: npx serverless deploy --stage "$STAGE" --verbose

      - name: Resolve API URL
        id: api
        run: |
          URL=$(node scripts/ci/print-api-url.cjs "$STAGE")
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"
          echo "API_URL=$URL" >> "$GITHUB_ENV"

      - name: Seed feature table
        env:
          DYNAMODB_TABLE_NAME: checkout-store-${{ steps.meta.outputs.stage }}
          DYNAMODB_ENDPOINT: ''
          AWS_REGION: ${{ env.AWS_REGION }}
        run: npm run seed

      - name: Ensure Amplify feature branch + env (point FE at this API)
        id: amplify
        if: env.AMPLIFY_APP_ID != ''
        run: |
          set -euo pipefail
          BRANCH='${{ steps.meta.outputs.amplify_branch }}'
          API_URL='${{ steps.api.outputs.api_url }}'
          RESULT=$(node scripts/ci/amplify-sync-branch-env.cjs \
            --app-id "$AMPLIFY_APP_ID" \
            --branch "$BRANCH" \
            --api-url "$API_URL" \
            --start-job | tail -n1)
          echo "amplify_sync=$RESULT"
          FE_URL=$(echo "$RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).amplifyUrl||''))")
          JOB=$(echo "$RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).jobId||''))")
          echo "amplify_url=$FE_URL" >> "$GITHUB_OUTPUT"
          echo "amplify_job_id=$JOB" >> "$GITHUB_OUTPUT"
          echo "amplify_gated=true" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Feature environment"
            echo "- Stage: \`${{ steps.meta.outputs.stage }}\`"
            echo "- API: \`${{ steps.api.outputs.api_url }}\`"
            echo "- Amplify branch: \`${{ steps.meta.outputs.amplify_branch }}\`"
            echo "- Amplify job: \`${{ steps.amplify.outputs.amplify_job_id || 'n/a' }}\`"
            echo "- FE: \`${{ steps.amplify.outputs.amplify_url || steps.cors.outputs.amplify_url || 'configure AMPLIFY_APP_ID' }}\`"
            echo ""
            echo "Tear down: Actions → **Destroy feature stack** (confirm \`destroy\`)."
          } >> "$GITHUB_STEP_SUMMARY"

  publish-urls:
    name: Comment FE/API URLs
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'success' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Post sticky PR / commit comment
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          COMMENT_KIND: feature
          FE_URL: ${{ needs.deploy.outputs.amplify_url }}
          API_URL: ${{ needs.deploy.outputs.api_url }}
          STAGE: ${{ needs.deploy.outputs.stage }}
          AMPLIFY_BRANCH: ${{ needs.deploy.outputs.amplify_branch }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/post-env-urls-comment.cjs

  amplify-build:
    name: Amplify build (required)
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'success' && needs.deploy.outputs.amplify_gated == 'true' }}
    timeout-minutes: 25
    environment: feature
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Wait for Amplify SUCCEED
        env:
          GITHUB_SHA: ${{ github.sha }}
        run: |
          node scripts/ci/wait-amplify-job.cjs \
            --app-id "$AMPLIFY_APP_ID" \
            --branch "${{ needs.deploy.outputs.amplify_branch }}" \
            --job-id "${{ needs.deploy.outputs.amplify_job_id }}" \
            --commit "$GITHUB_SHA" \
            --timeout-sec 1200 \
            --interval-sec 15
          echo "### Amplify build gate (feature)" >> "$GITHUB_STEP_SUMMARY"
          echo "- Job: \`${{ needs.deploy.outputs.amplify_job_id }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Result: **SUCCEED**" >> "$GITHUB_STEP_SUMMARY"

  smoke:
    name: Feature post-deploy smoke
    runs-on: ubuntu-latest
    needs: [deploy, amplify-build]
    if: ${{ always() && needs.deploy.result == 'success' && (needs.amplify-build.result == 'success' || needs.amplify-build.result == 'skipped') && (needs.deploy.outputs.amplify_url != '' || needs.deploy.outputs.api_url != '') }}
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium
        working-directory: apps/web
      - name: Wait API
        run: node scripts/ci/wait-http-ready.cjs "${{ needs.deploy.outputs.api_url }}/products" 600 10
      - name: Wait FE
        if: needs.deploy.outputs.amplify_url != ''
        run: node scripts/ci/wait-http-ready.cjs "${{ needs.deploy.outputs.amplify_url }}" 900 15
      - name: Playwright E2E
        if: needs.deploy.outputs.amplify_url != ''
        working-directory: apps/web
        env:
          FE_BASE_URL: ${{ needs.deploy.outputs.amplify_url }}
          API_BASE_URL: ${{ needs.deploy.outputs.api_url }}
          CI: true
        run: npx playwright test
      - name: API-only Playwright
        if: needs.deploy.outputs.amplify_url == ''
        working-directory: apps/web
        env:
          FE_BASE_URL: http://127.0.0.1:9
          API_BASE_URL: ${{ needs.deploy.outputs.api_url }}
          CI: true
        run: npx playwright test e2e/api.smoke.spec.ts
      - name: OWASP ZAP baseline (API)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ needs.deploy.outputs.api_url }}/products
          fail_action: true
          allow_issue_writing: false
          cmd_options: '-a -I'
      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report-feature
          path: apps/web/playwright-report
          if-no-files-found: ignore

  stress:
    name: Artillery stress (optional, non-blocking)
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'success' && needs.deploy.outputs.api_url != '' && vars.STRESS_ENABLED != 'false' }}
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Wait API
        run: node scripts/ci/wait-http-ready.cjs "${{ needs.deploy.outputs.api_url }}/products" 300 10
      - name: Run Artillery
        env:
          API_BASE_URL: ${{ needs.deploy.outputs.api_url }}
        run: |
          set +e
          npx artillery run load/artillery-products.yml --output artillery-report.json
          CODE=$?
          npx artillery report artillery-report.json --output artillery-report.html || true
          echo "### Artillery stress (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: \`${{ needs.deploy.outputs.api_url }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Exit code: $CODE (continue-on-error — no rollback)" >> "$GITHUB_STEP_SUMMARY"
          exit $CODE
      - name: Upload Artillery report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: artillery-report-feature
          path: |
            artillery-report.json
            artillery-report.html
          if-no-files-found: ignore

  rollback:
    name: Rollback feature API on smoke failure
    runs-on: ubuntu-latest
    needs: [smoke, deploy]
    if: ${{ always() && needs.deploy.result == 'success' && needs.smoke.result == 'failure' }}
    environment: feature
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Resolve previous SHA on this ref
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: deploy-feature.yml
        run: |
          RESULT=$(node scripts/ci/resolve-last-good-sha.cjs)
          SHA=$(echo "$RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);console.log(j.previousSha||'')})")
          echo "previous_sha=$SHA" >> "$GITHUB_OUTPUT"
      - name: Redeploy last-good
        env:
          PREV: ${{ steps.prev.outputs.previous_sha }}
          STAGE: ${{ needs.deploy.outputs.stage }}
          GH_PAYMENT_API_URL: ${{ secrets.PAYMENT_API_URL }}
          GH_PAYMENT_PUBLIC_KEY: ${{ secrets.PAYMENT_PUBLIC_KEY }}
          GH_PAYMENT_PRIVATE_KEY: ${{ secrets.PAYMENT_PRIVATE_KEY }}
          GH_PAYMENT_INTEGRITY_KEY: ${{ secrets.PAYMENT_INTEGRITY_KEY }}
          GH_PAYMENT_GATEWAY_MODE: ${{ vars.PAYMENT_GATEWAY_MODE_FEATURE || vars.PAYMENT_GATEWAY_MODE || 'fake' }}
        run: |
          {
            echo "PAYMENT_API_URL=$GH_PAYMENT_API_URL"
            echo "PAYMENT_PUBLIC_KEY=$GH_PAYMENT_PUBLIC_KEY"
            echo "PAYMENT_PRIVATE_KEY=$GH_PAYMENT_PRIVATE_KEY"
            echo "PAYMENT_INTEGRITY_KEY=$GH_PAYMENT_INTEGRITY_KEY"
            echo "PAYMENT_GATEWAY_MODE=$GH_PAYMENT_GATEWAY_MODE"
            echo "DYNAMODB_TABLE_NAME=checkout-store-$STAGE"
            echo "DYNAMODB_ENDPOINT="
          } >> "$GITHUB_ENV"
          chmod +x scripts/ci/rollback-api.sh
          if [ -z "$PREV" ]; then
            echo "No prior feature deploy SHA — cannot rollback" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          scripts/ci/rollback-api.sh "$PREV" "$STAGE"
