name: Deploy feature (fb-*)

# Feature branches / tags: fb-xxx or fb-xxx/*
# Creates an isolated Serverless stage (API + DynamoDB) AND an Amplify branch
# so FE+BE are fully separate from production.
#
# Branch examples: fb-42/checkout-fees , fb-99/fix-stock
# Tag examples:    fb-42/smoke
on:
  push:
    branches:
      - 'fb-*/**'
      - 'fb-*'
    tags:
      - 'fb-*/**'
      - 'fb-*'
  workflow_dispatch:
    inputs:
      ref_name:
        description: 'Override ref name (e.g. fb-42/my-feature)'
        required: false
        default: ''

concurrency:
  group: deploy-feature-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  id-token: write
  pull-requests: write

env:
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}

jobs:
  quality:
    name: Quality gate
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  deploy:
    name: Feature stack + Amplify
    runs-on: ubuntu-latest
    needs: quality
    environment: feature
    outputs:
      stage: ${{ steps.meta.outputs.stage }}
      api_url: ${{ steps.api.outputs.api_url }}
      amplify_url: ${{ steps.amplify.outputs.amplify_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - run: npm ci
      - run: npm run build:api

      - name: Resolve stage from ref
        id: meta
        run: |
          REF="${{ inputs.ref_name || github.ref_name }}"
          META=$(node scripts/ci/stage-from-ref.cjs "$REF")
          echo "meta=$META"
          STAGE=$(echo "$META" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).stage))")
          BRANCH=$(echo "$META" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).amplifyBranch))")
          IS_FB=$(echo "$META" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).isFeature))")
          if [ "$IS_FB" != "true" ]; then
            echo "Ref '$REF' is not an fb-* feature ref"
            exit 1
          fi
          echo "stage=$STAGE" >> "$GITHUB_OUTPUT"
          echo "amplify_branch=$BRANCH" >> "$GITHUB_OUTPUT"
          echo "STAGE=$STAGE" >> "$GITHUB_ENV"

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Predict Amplify URL (for CORS)
        id: cors
        run: |
          if [ -z "$AMPLIFY_APP_ID" ]; then
            echo "AMPLIFY_APP_ID not set — CORS will use localhost only"
            echo "cors_origin=http://localhost:5173" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          DOMAIN=$(aws amplify get-app --app-id "$AMPLIFY_APP_ID" --query 'app.defaultDomain' --output text)
          # Amplify replaces '/' with '-' in the hostname
          HOST=$(echo '${{ steps.meta.outputs.amplify_branch }}' | sed 's|/|-|g')
          FE_URL="https://${HOST}.${DOMAIN}"
          echo "cors_origin=${FE_URL},http://localhost:5173" >> "$GITHUB_OUTPUT"
          echo "amplify_url=$FE_URL" >> "$GITHUB_OUTPUT"
          echo "Predicted Amplify URL: $FE_URL"

      - name: Export env for Serverless
        env:
          PAYMENT_API_URL: ${{ secrets.PAYMENT_API_URL }}
          PAYMENT_PUBLIC_KEY: ${{ secrets.PAYMENT_PUBLIC_KEY }}
          PAYMENT_PRIVATE_KEY: ${{ secrets.PAYMENT_PRIVATE_KEY }}
          PAYMENT_INTEGRITY_KEY: ${{ secrets.PAYMENT_INTEGRITY_KEY }}
          PAYMENT_GATEWAY_MODE: ${{ vars.PAYMENT_GATEWAY_MODE_FEATURE || vars.PAYMENT_GATEWAY_MODE || 'fake' }}
        run: |
          {
            echo "PAYMENT_API_URL=$PAYMENT_API_URL"
            echo "PAYMENT_PUBLIC_KEY=$PAYMENT_PUBLIC_KEY"
            echo "PAYMENT_PRIVATE_KEY=$PAYMENT_PRIVATE_KEY"
            echo "PAYMENT_INTEGRITY_KEY=$PAYMENT_INTEGRITY_KEY"
            echo "PAYMENT_GATEWAY_MODE=$PAYMENT_GATEWAY_MODE"
            echo "CORS_ORIGIN=${{ steps.cors.outputs.cors_origin }}"
            echo "DYNAMODB_ENDPOINT="
            echo "DYNAMODB_TABLE_NAME=checkout-store-${STAGE}"
          } >> "$GITHUB_ENV"

      - name: Deploy isolated API stack
        run: npx serverless deploy --stage "$STAGE" --verbose

      - name: Resolve API URL
        id: api
        run: |
          URL=$(node scripts/ci/print-api-url.cjs "$STAGE")
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"
          echo "API_URL=$URL" >> "$GITHUB_ENV"

      - name: Seed feature table
        env:
          DYNAMODB_TABLE_NAME: checkout-store-${{ steps.meta.outputs.stage }}
          DYNAMODB_ENDPOINT: ''
          AWS_REGION: ${{ env.AWS_REGION }}
        run: npm run seed

      - name: Ensure Amplify feature branch + env
        id: amplify
        if: env.AMPLIFY_APP_ID != ''
        run: |
          set -euo pipefail
          BRANCH='${{ steps.meta.outputs.amplify_branch }}'
          APP="$AMPLIFY_APP_ID"
          API_URL='${{ steps.api.outputs.api_url }}'

          if aws amplify get-branch --app-id "$APP" --branch-name "$BRANCH" >/dev/null 2>&1; then
            echo "Branch exists — updating env vars"
            aws amplify update-branch \
              --app-id "$APP" \
              --branch-name "$BRANCH" \
              --environment-variables \
                "VITE_MOCK_MODE=false,VITE_API_BASE_URL=${API_URL},VITE_BASE_FEE=1500,VITE_DELIVERY_FEE=5000" \
              --enable-auto-build
          else
            echo "Creating Amplify branch $BRANCH"
            aws amplify create-branch \
              --app-id "$APP" \
              --branch-name "$BRANCH" \
              --framework 'Web' \
              --stage 'DEVELOPMENT' \
              --enable-auto-build \
              --environment-variables \
                "VITE_MOCK_MODE=false,VITE_API_BASE_URL=${API_URL},VITE_BASE_FEE=1500,VITE_DELIVERY_FEE=5000"
          fi

          # Kick a build (Amplify may also auto-build on push if connected to GitHub)
          JOB=$(aws amplify start-job --app-id "$APP" --branch-name "$BRANCH" --job-type RELEASE --query 'jobSummary.jobId' --output text || true)
          echo "Started Amplify job: ${JOB:-n/a}"

          DOMAIN=$(aws amplify get-app --app-id "$APP" --query 'app.defaultDomain' --output text)
          HOST=$(echo "$BRANCH" | sed 's|/|-|g')
          FE_URL="https://${HOST}.${DOMAIN}"
          echo "amplify_url=$FE_URL" >> "$GITHUB_OUTPUT"

      - name: Summary
        run: |
          {
            echo "### Feature environment"
            echo "- Stage: \`${{ steps.meta.outputs.stage }}\`"
            echo "- API: \`${{ steps.api.outputs.api_url }}\`"
            echo "- Amplify branch: \`${{ steps.meta.outputs.amplify_branch }}\`"
            echo "- FE: \`${{ steps.amplify.outputs.amplify_url || steps.cors.outputs.amplify_url || 'configure AMPLIFY_APP_ID' }}\`"
            echo ""
            echo "Tear down API later:"
            echo "\`\`\`"
            echo "npx serverless remove --stage ${{ steps.meta.outputs.stage }}"
            echo "\`\`\`"
          } >> "$GITHUB_STEP_SUMMARY"
