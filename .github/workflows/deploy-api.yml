name: Deploy API (prod)

# Deploys only changed Lambdas on main/master. Full stack when shared/serverless change.
# HARD REQUIREMENT: the reusable CI workflow (validate→…→coverage→CodeQL) must succeed first.
# Post-deploy: Playwright E2E + OWASP ZAP; on failure → rollback to last-good SHA.
# Frontend production is owned by AWS Amplify (configure the Amplify app separately).
# refs specs/deploy-smoke-rollback/spec.md · ADR 0012
on:
  push:
    branches: [main, master]
    paths:
      - 'services/**'
      - 'packages/**'
      - 'infra/**'
      - 'serverless.ts'
      - 'package.json'
      - 'package-lock.json'
      - 'apps/web/e2e/**'
      - 'apps/web/playwright.config.ts'
      - '.github/workflows/deploy-api.yml'
      - '.github/workflows/ci.yml'
      - 'scripts/ci/**'
  workflow_dispatch:
    inputs:
      mode:
        description: 'full | functions | auto'
        required: true
        default: auto
        type: choice
        options: [auto, full, functions]
      functions:
        description: 'Comma list when mode=functions (e.g. products,transactions)'
        required: false
        default: ''
      skip_smoke:
        description: 'Skip post-deploy Playwright/ZAP (emergency only)'
        required: false
        default: false
        type: boolean
      skip_stress:
        description: 'Skip optional Artillery stress (non-blocking anyway)'
        required: false
        default: false
        type: boolean

concurrency:
  group: deploy-api-prod
  cancel-in-progress: false

permissions:
  contents: write
  id-token: write
  actions: read
  security-events: write
  pull-requests: write

env:
  STAGE: ${{ vars.SERVERLESS_STAGE || 'prod' }}
  AWS_REGION: ${{ vars.AWS_REGION || 'us-east-1' }}
  FE_BASE_URL: ${{ vars.FE_BASE_URL || 'https://master.dw2i8myh0xumx.amplifyapp.com' }}
  # Serverless Framework v4 requires auth in CI (no interactive login).
  SERVERLESS_ACCESS_KEY: ${{ secrets.SERVERLESS_ACCESS_KEY }}
  SERVERLESS_LICENSE_KEY: ${{ secrets.SERVERLESS_LICENSE_KEY }}

jobs:
  quality:
    name: Quality gate (required)
    uses: ./.github/workflows/ci.yml
    secrets: inherit

  baseline:
    name: Capture last-good SHA
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    outputs:
      previous_sha: ${{ steps.prev.outputs.previous_sha }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve previous successful deploy SHA
        id: prev
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_RUN_ID: ${{ github.run_id }}
          WORKFLOW_FILE: deploy-api.yml
        run: |
          RESULT=$(node scripts/ci/resolve-last-good-sha.cjs)
          echo "result=$RESULT"
          SHA=$(echo "$RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>{const j=JSON.parse(d);console.log(j.previousSha||'')})")
          echo "previous_sha=$SHA" >> "$GITHUB_OUTPUT"
          echo "Last-good SHA: ${SHA:-none}" >> "$GITHUB_STEP_SUMMARY"

  detect:
    name: Detect changed services
    runs-on: ubuntu-latest
    needs: quality
    if: ${{ needs.quality.result == 'success' }}
    outputs:
      mode: ${{ steps.detect.outputs.mode }}
      functions: ${{ steps.detect.outputs.functions }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - id: detect
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.mode }}" != "auto" ]; then
            MODE="${{ inputs.mode }}"
            if [ "$MODE" = "functions" ] && [ -n "${{ inputs.functions }}" ]; then
              FUNCS='${{ inputs.functions }}'
              JSON=$(node -e "const a=process.argv[1].split(',').map(s=>s.trim()).filter(Boolean); console.log(JSON.stringify(a))" "$FUNCS")
            else
              JSON='["products","customers","deliveries","transactions","ordersWorker"]'
            fi
          else
            BEFORE="${{ github.event.before }}"
            if [ -z "$BEFORE" ] || [ "$BEFORE" = "0000000000000000000000000000000000000000" ]; then
              BEFORE="HEAD~1"
            fi
            RESULT=$(node scripts/ci/detect-changed-services.cjs "$BEFORE" HEAD)
            echo "detect=$RESULT"
            MODE=$(echo "$RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).mode))")
            JSON=$(echo "$RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.stringify(JSON.parse(d).functions)))")
          fi
          echo "mode=$MODE" >> "$GITHUB_OUTPUT"
          echo "functions=$JSON" >> "$GITHUB_OUTPUT"
          echo "Deploy mode=$MODE functions=$JSON"

  deploy:
    name: Deploy Serverless
    runs-on: ubuntu-latest
    needs: [quality, detect, baseline]
    if: ${{ needs.quality.result == 'success' && needs.detect.result == 'success' && needs.detect.outputs.mode != 'none' }}
    environment: production
    outputs:
      api_url: ${{ steps.url.outputs.api_url }}
      amplify_url: ${{ steps.amplify_sync.outputs.amplify_url }}
      deployed: ${{ steps.mark.outputs.deployed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:api

      - name: Require Serverless Framework v4 auth
        run: |
          if [ -z "${SERVERLESS_ACCESS_KEY:-}" ] && [ -z "${SERVERLESS_LICENSE_KEY:-}" ]; then
            echo "### Missing Serverless auth" >> "$GITHUB_STEP_SUMMARY"
            echo "SF v4 needs \`SERVERLESS_ACCESS_KEY\` (Dashboard → Settings → Access Keys) or \`SERVERLESS_LICENSE_KEY\` as a GitHub Actions secret." >> "$GITHUB_STEP_SUMMARY"
            echo "Docs: https://www.serverless.com/framework/docs/guides/upgrading-v4" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          echo "Serverless auth env present (accessKey=$([ -n "${SERVERLESS_ACCESS_KEY:-}" ] && echo yes || echo no), licenseKey=$([ -n "${SERVERLESS_LICENSE_KEY:-}" ] && echo yes || echo no))"

      - name: Load secrets from Vault
        uses: ./.github/actions/load-vault-secrets
        with:
          stage: ${{ env.STAGE }}
          vault_addr: ${{ secrets.VAULT_ADDR }}
          role_id: ${{ secrets.VAULT_ROLE_ID }}
          secret_id: ${{ secrets.VAULT_SECRET_ID }}
          required: ${{ vars.VAULT_REQUIRED || 'false' }}

      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}

      - name: Fallback fill missing env from GitHub Secrets
        env:
          GH_PAYMENT_API_URL: ${{ secrets.PAYMENT_API_URL }}
          GH_PAYMENT_PUBLIC_KEY: ${{ secrets.PAYMENT_PUBLIC_KEY }}
          GH_PAYMENT_PRIVATE_KEY: ${{ secrets.PAYMENT_PRIVATE_KEY }}
          GH_PAYMENT_INTEGRITY_KEY: ${{ secrets.PAYMENT_INTEGRITY_KEY }}
          GH_PAYMENT_GATEWAY_MODE: ${{ vars.PAYMENT_GATEWAY_MODE || 'sandbox' }}
          GH_CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          {
            [ -n "${PAYMENT_API_URL:-}" ] || echo "PAYMENT_API_URL=$GH_PAYMENT_API_URL"
            [ -n "${PAYMENT_PUBLIC_KEY:-}" ] || echo "PAYMENT_PUBLIC_KEY=$GH_PAYMENT_PUBLIC_KEY"
            [ -n "${PAYMENT_PRIVATE_KEY:-}" ] || echo "PAYMENT_PRIVATE_KEY=$GH_PAYMENT_PRIVATE_KEY"
            [ -n "${PAYMENT_INTEGRITY_KEY:-}" ] || echo "PAYMENT_INTEGRITY_KEY=$GH_PAYMENT_INTEGRITY_KEY"
            [ -n "${PAYMENT_GATEWAY_MODE:-}" ] || echo "PAYMENT_GATEWAY_MODE=$GH_PAYMENT_GATEWAY_MODE"
            [ -n "${CORS_ORIGIN:-}" ] || echo "CORS_ORIGIN=$GH_CORS_ORIGIN"
            echo "DYNAMODB_ENDPOINT="
          } >> "$GITHUB_ENV"

      - name: Full stack deploy
        if: needs.detect.outputs.mode == 'full'
        run: npx serverless deploy --stage "$STAGE" --verbose

      - name: Function-only deploy
        if: needs.detect.outputs.mode == 'functions'
        run: |
          FUNCS=$(echo '${{ needs.detect.outputs.functions }}' | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>JSON.parse(d).forEach(f=>console.log(f)))")
          for fn in $FUNCS; do
            echo "Deploying function: $fn"
            npx serverless deploy function --function "$fn" --stage "$STAGE" --verbose
          done

      - name: Resolve API URL
        id: url
        run: |
          URL=$(node scripts/ci/print-api-url.cjs "$STAGE")
          echo "api_url=$URL" >> "$GITHUB_OUTPUT"
          echo "### API ($STAGE)" >> "$GITHUB_STEP_SUMMARY"
          echo "- URL: \`$URL\`" >> "$GITHUB_STEP_SUMMARY"
          echo "- Mode: \`${{ needs.detect.outputs.mode }}\`" >> "$GITHUB_STEP_SUMMARY"

      - name: Sync Amplify prod branch env → this API
        id: amplify_sync
        if: ${{ vars.AMPLIFY_APP_ID != '' }}
        env:
          AMPLIFY_APP_ID: ${{ vars.AMPLIFY_APP_ID }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_PROD_BRANCH || 'master' }}
        run: |
          set -euo pipefail
          RESULT=$(node scripts/ci/amplify-sync-branch-env.cjs \
            --app-id "$AMPLIFY_APP_ID" \
            --branch "$AMPLIFY_BRANCH" \
            --api-url "${{ steps.url.outputs.api_url }}" \
            --start-job | tail -n1)
          echo "amplify_sync=$RESULT"
          FE=$(echo "$RESULT" | node -e "let d='';process.stdin.on('data',c=>d+=c);process.stdin.on('end',()=>console.log(JSON.parse(d).amplifyUrl||''))")
          echo "amplify_url=$FE" >> "$GITHUB_OUTPUT"
          echo "FE: $FE" >> "$GITHUB_STEP_SUMMARY"

      - name: Seed catalog (full deploy only)
        if: needs.detect.outputs.mode == 'full'
        env:
          DYNAMODB_TABLE_NAME: checkout-store-${{ env.STAGE }}
          DYNAMODB_ENDPOINT: ''
          AWS_REGION: ${{ env.AWS_REGION }}
        run: |
          npm run seed || echo "Seed skipped/failed — run manually if table already seeded"

      - id: mark
        run: echo "deployed=true" >> "$GITHUB_OUTPUT"

  publish-urls:
    name: Comment prod FE/API URLs
    runs-on: ubuntu-latest
    needs: deploy
    if: ${{ always() && needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true' }}
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Post commit comment
        env:
          GH_TOKEN: ${{ github.token }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_SHA: ${{ github.sha }}
          GITHUB_REF_NAME: ${{ github.ref_name }}
          COMMENT_KIND: prod
          FE_URL: ${{ needs.deploy.outputs.amplify_url || vars.FE_BASE_URL || 'https://master.dw2i8myh0xumx.amplifyapp.com' }}
          API_URL: ${{ needs.deploy.outputs.api_url }}
          STAGE: ${{ env.STAGE }}
          AMPLIFY_BRANCH: ${{ vars.AMPLIFY_PROD_BRANCH || 'master' }}
          GITHUB_RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: node scripts/ci/post-env-urls-comment.cjs

  smoke:
    name: Post-deploy E2E + ZAP
    runs-on: ubuntu-latest
    needs: [deploy, baseline]
    if: ${{ always() && needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true' && (github.event_name != 'workflow_dispatch' || inputs.skip_smoke != true) }}
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Install Playwright Chromium
        # Matrix includes chromium + chromium-se + firefox + webkit (responsive B2).
        run: npx playwright install --with-deps chromium firefox webkit
        working-directory: apps/web

      - name: Wait for API ready
        run: node scripts/ci/wait-http-ready.cjs "${{ needs.deploy.outputs.api_url }}/products" 600 10

      - name: Wait for FE ready
        run: node scripts/ci/wait-http-ready.cjs "${{ env.FE_BASE_URL }}" 900 15

      - name: Playwright E2E
        working-directory: apps/web
        env:
          FE_BASE_URL: ${{ env.FE_BASE_URL }}
          API_BASE_URL: ${{ needs.deploy.outputs.api_url }}
          CI: true
        run: npx playwright test

      - name: Upload Playwright report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: playwright-report-prod
          path: apps/web/playwright-report
          if-no-files-found: ignore

      - name: OWASP ZAP baseline (API)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ needs.deploy.outputs.api_url }}/products
          fail_action: true
          allow_issue_writing: false
          cmd_options: '-a -I'
          rules_file_name: '.zap/rules.tsv'
          artifact_name: zap-scan-api-prod

      - name: OWASP ZAP baseline (FE)
        uses: zaproxy/action-baseline@v0.14.0
        with:
          target: ${{ env.FE_BASE_URL }}
          fail_action: true
          allow_issue_writing: false
          cmd_options: '-a -I'
          rules_file_name: '.zap/rules.tsv'
          artifact_name: zap-scan-fe-prod

  stress:
    name: Artillery stress (optional, non-blocking)
    runs-on: ubuntu-latest
    needs: [deploy]
    # Never gates deploy success / rollback. continue-on-error keeps workflow green.
    if: ${{ always() && needs.deploy.result == 'success' && needs.deploy.outputs.deployed == 'true' && vars.STRESS_ENABLED != 'false' && (github.event_name != 'workflow_dispatch' || inputs.skip_stress != true) }}
    continue-on-error: true
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Wait for API ready
        run: node scripts/ci/wait-http-ready.cjs "${{ needs.deploy.outputs.api_url }}/products" 300 10
      - name: Run Artillery (mild load)
        env:
          API_BASE_URL: ${{ needs.deploy.outputs.api_url }}
        run: |
          set +e
          npx artillery run load/artillery-products.yml --output artillery-report.json
          CODE=$?
          if [ -f artillery-report.json ]; then
            npx artillery report artillery-report.json --output artillery-report.html || true
          else
            echo "No artillery-report.json (run exited $CODE) — skipping HTML report"
          fi
          echo "### Artillery stress (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
          echo "Target: \`${{ needs.deploy.outputs.api_url }}\`" >> "$GITHUB_STEP_SUMMARY"
          echo "Exit code: $CODE (job has continue-on-error — does **not** rollback)" >> "$GITHUB_STEP_SUMMARY"
          exit $CODE
      - name: Upload Artillery report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: artillery-report-prod
          path: |
            artillery-report.json
            artillery-report.html
          if-no-files-found: ignore

  rollback:
    name: Rollback API on smoke failure
    runs-on: ubuntu-latest
    needs: [smoke, baseline, deploy]
    if: ${{ always() && needs.deploy.result == 'success' && needs.smoke.result == 'failure' }}
    environment: production
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - name: Configure AWS credentials
        uses: aws-actions/configure-aws-credentials@v4
        with:
          aws-access-key-id: ${{ secrets.AWS_ACCESS_KEY_ID }}
          aws-secret-access-key: ${{ secrets.AWS_SECRET_ACCESS_KEY }}
          aws-region: ${{ env.AWS_REGION }}
      - name: Load secrets for rollback deploy
        uses: ./.github/actions/load-vault-secrets
        with:
          stage: ${{ env.STAGE }}
          vault_addr: ${{ secrets.VAULT_ADDR }}
          role_id: ${{ secrets.VAULT_ROLE_ID }}
          secret_id: ${{ secrets.VAULT_SECRET_ID }}
          required: ${{ vars.VAULT_REQUIRED || 'false' }}
      - name: Fallback payment env
        env:
          GH_PAYMENT_API_URL: ${{ secrets.PAYMENT_API_URL }}
          GH_PAYMENT_PUBLIC_KEY: ${{ secrets.PAYMENT_PUBLIC_KEY }}
          GH_PAYMENT_PRIVATE_KEY: ${{ secrets.PAYMENT_PRIVATE_KEY }}
          GH_PAYMENT_INTEGRITY_KEY: ${{ secrets.PAYMENT_INTEGRITY_KEY }}
          GH_PAYMENT_GATEWAY_MODE: ${{ vars.PAYMENT_GATEWAY_MODE || 'sandbox' }}
          GH_CORS_ORIGIN: ${{ vars.CORS_ORIGIN }}
        run: |
          {
            [ -n "${PAYMENT_API_URL:-}" ] || echo "PAYMENT_API_URL=$GH_PAYMENT_API_URL"
            [ -n "${PAYMENT_PUBLIC_KEY:-}" ] || echo "PAYMENT_PUBLIC_KEY=$GH_PAYMENT_PUBLIC_KEY"
            [ -n "${PAYMENT_PRIVATE_KEY:-}" ] || echo "PAYMENT_PRIVATE_KEY=$GH_PAYMENT_PRIVATE_KEY"
            [ -n "${PAYMENT_INTEGRITY_KEY:-}" ] || echo "PAYMENT_INTEGRITY_KEY=$GH_PAYMENT_INTEGRITY_KEY"
            [ -n "${PAYMENT_GATEWAY_MODE:-}" ] || echo "PAYMENT_GATEWAY_MODE=$GH_PAYMENT_GATEWAY_MODE"
            [ -n "${CORS_ORIGIN:-}" ] || echo "CORS_ORIGIN=$GH_CORS_ORIGIN"
            echo "DYNAMODB_ENDPOINT="
          } >> "$GITHUB_ENV"
      - name: Redeploy last-good SHA
        env:
          PREV: ${{ needs.baseline.outputs.previous_sha }}
        run: |
          chmod +x scripts/ci/rollback-api.sh
          if [ -z "$PREV" ]; then
            echo "### Rollback skipped — no prior successful deploy SHA" >> "$GITHUB_STEP_SUMMARY"
            exit 1
          fi
          scripts/ci/rollback-api.sh "$PREV" "$STAGE"
          echo "### Rolled back API to \`$PREV\`" >> "$GITHUB_STEP_SUMMARY"
      - name: Best-effort Amplify rollback job
        if: ${{ vars.AMPLIFY_APP_ID != '' && needs.baseline.outputs.previous_sha != '' }}
        env:
          APP: ${{ vars.AMPLIFY_APP_ID }}
          SHA: ${{ needs.baseline.outputs.previous_sha }}
        run: |
          echo "Amplify FE rollback is best-effort. Prefer re-running Amplify build for commit $SHA on master."
          echo "API was reverted; FE may briefly mismatch until Amplify rebuilds from a fixed commit." >> "$GITHUB_STEP_SUMMARY"
