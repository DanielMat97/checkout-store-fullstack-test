name: CI

# Quality gates (ordered): validate → prettier → lint → audit → test → coverage
# + CodeQL (+ SonarCloud if SONAR_TOKEN) → quality-ok
# Deploy workflows MUST call this via workflow_call and need: quality (fail-closed).
# refs specs/deploy-smoke-rollback/spec.md · ADR 0012
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
    outputs:
      result:
        description: 'success when the full quality pipeline passed'
        value: ${{ jobs.quality-ok.outputs.result }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  security-events: write
  actions: read

jobs:
  validate:
    name: Validate (build / tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run validate

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run lint

  audit:
    name: Audit (OWASP deps)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run audit

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [prettier, lint, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm test

  backend-on-fe:
    name: Backend gate (on FE changes)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Detect FE changes + run Nest test/cov/audit
        env:
          BASE_REF: ${{ github.event.before || github.event.pull_request.base.sha }}
          HEAD_REF: ${{ github.sha }}
        run: npm run ci:backend-on-fe

  coverage:
    name: Coverage (>80%)
    runs-on: ubuntu-latest
    needs: [test, backend-on-fe]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run test:cov
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            **/coverage/lcov.info
            **/coverage/coverage-final.json
          if-no-files-found: ignore

  codeql:
    name: CodeQL (SAST)
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: github/codeql-action/init@v3.37.3
        with:
          languages: javascript-typescript
          queries: security-extended
      - uses: github/codeql-action/autobuild@v3.37.3
      - uses: github/codeql-action/analyze@v3.37.3
        with:
          category: '/language:javascript-typescript'

  sonar:
    name: SonarCloud (optional)
    runs-on: ubuntu-latest
    needs: coverage
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Decide Sonar
        id: sonar
        env:
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        run: |
          if [ -n "${SONAR_TOKEN:-}" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
            echo "SonarCloud skipped (no SONAR_TOKEN) — free OSS optional per ADR 0012" >> "$GITHUB_STEP_SUMMARY"
          fi
      - name: SonarCloud Scan
        id: scan
        if: steps.sonar.outputs.run == 'true'
        continue-on-error: true
        uses: SonarSource/sonarqube-scan-action@v5.0.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Quote projectName — spaces break sonar-scanner argv otherwise.
          args: >
            -Dsonar.organization=${{ vars.SONAR_ORGANIZATION }}
            -Dsonar.projectKey=${{ vars.SONAR_PROJECT_KEY }}
            -Dsonar.projectName="Checkout Store NORA"
            -Dsonar.sources=apps,services,packages
            -Dsonar.exclusions=**/dist/**,**/coverage/**,**/node_modules/**,**/*.spec.ts,**/*.spec.tsx,**/e2e/**
      - name: Sonar optional outcome
        if: steps.sonar.outputs.run == 'true'
        run: |
          if [ "${{ steps.scan.outcome }}" = "failure" ]; then
            echo "### SonarCloud scan failed (non-blocking)" >> "$GITHUB_STEP_SUMMARY"
            echo "Token presente pero el scan falló — no bloquea quality-ok (ADR 0012 / 0013: Sonar es opcional)." >> "$GITHUB_STEP_SUMMARY"
            echo "Revisá projectKey=\`${{ vars.SONAR_PROJECT_KEY }}\` / org=\`${{ vars.SONAR_ORGANIZATION }}\` en SonarCloud." >> "$GITHUB_STEP_SUMMARY"
          else
            echo "### SonarCloud scan OK" >> "$GITHUB_STEP_SUMMARY"
          fi

  # Single success signal for deploy workflows (needs: quality → this job).
  quality-ok:
    name: Quality OK
    runs-on: ubuntu-latest
    needs: [coverage, codeql, sonar]
    if: ${{ always() && needs.coverage.result == 'success' && needs.codeql.result == 'success' && needs.sonar.result == 'success' }}
    outputs:
      result: ${{ steps.mark.outputs.result }}
    steps:
      - id: mark
        run: |
          echo "result=success" >> "$GITHUB_OUTPUT"
          echo "### Quality pipeline passed" >> "$GITHUB_STEP_SUMMARY"
          echo "validate → prettier → lint → audit → test → coverage → CodeQL → Sonar(optional skip-as-success)" >> "$GITHUB_STEP_SUMMARY"
