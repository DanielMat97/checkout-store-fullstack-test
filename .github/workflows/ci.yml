name: CI

# Quality gates (ordered): validate → prettier → lint → audit → test → coverage → quality-ok
# Deploy workflows MUST call this via workflow_call and need: quality (fail-closed).
on:
  pull_request:
  push:
    branches: [main, master]
  workflow_dispatch:
  workflow_call:
    outputs:
      result:
        description: 'success when the full quality pipeline passed'
        value: ${{ jobs.quality-ok.outputs.result }}

concurrency:
  group: ci-${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  validate:
    name: Validate (build / tsc)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run validate

  prettier:
    name: Prettier
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run format:check

  lint:
    name: Lint
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run lint

  audit:
    name: Audit
    runs-on: ubuntu-latest
    needs: validate
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run audit

  test:
    name: Test
    runs-on: ubuntu-latest
    needs: [prettier, lint, audit]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm test

  coverage:
    name: Coverage (>80%)
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
      - run: npm ci
      - run: npm run build:shared
      - run: npm run test:cov
      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-reports
          path: |
            **/coverage/lcov.info
            **/coverage/coverage-final.json
          if-no-files-found: ignore

  # Single success signal for deploy workflows (needs: quality → this job).
  quality-ok:
    name: Quality OK
    runs-on: ubuntu-latest
    needs: coverage
    if: ${{ needs.coverage.result == 'success' }}
    outputs:
      result: ${{ steps.mark.outputs.result }}
    steps:
      - id: mark
        run: |
          echo "result=success" >> "$GITHUB_OUTPUT"
          echo "### Quality pipeline passed" >> "$GITHUB_STEP_SUMMARY"
          echo "validate → prettier → lint → audit → test → coverage" >> "$GITHUB_STEP_SUMMARY"
