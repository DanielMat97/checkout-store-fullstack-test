# refs specs/dependabot-audit-autofix/spec.md · ADR 0017
# Keep noise low for the tech-test repo: patch/minor only (majors need a human).
version: 2
updates:
  - package-ecosystem: npm
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
    ignore:
      # Majors (e.g. typescript 5→7) remove options like moduleResolution=node10 and break validate.
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - github-actions
    ignore:
      - dependency-name: '*'
        update-types:
          - version-update:semver-major
